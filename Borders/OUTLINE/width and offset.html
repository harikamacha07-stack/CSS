<head>
    <style>
        p {
            outline: 5px solid green;
            padding: 5px;
            border: 1px solid black;
            margin: 5px;
            width: 200px;
        }
    </style>
</head>
<body>
<h2>The outline-offset Property</h2>
<p>This paragraph has an outline offset of 5px.</p><hr>
<p style="outline-offset: 10px; color: blue;">This paragraph has an outline offset of 10px.</p>
<hr><hr>
<p style="outline-offset: -15px; color: red;">This paragraph has an outline offset of -15px.</p>
</body>
