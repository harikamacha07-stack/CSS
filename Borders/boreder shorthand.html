<head>
    <style>
        p.one {
            border: 1px solid black;
        }
        p.two {
            border-left: 2px dashed red;
        }
        p.three {
            border-right: 3px dotted blue;
        }
        p.four {
            border-top: 4px double green;
        }
        p.five {
            border-bottom: 5px groove orange;
        }
    </style>
</head>
<body>
    <p class="one">This paragraph has a 1px solid black border.</p>
    <p class="two">This paragraph has a 2px dashed red left border.</p>
    <p class="three">This paragraph has a 3px dotted blue right border.</p>
    <p class="four">This paragraph has a 4px double green top border.</p>
    <p class="five">This paragraph has a 5px groove orange bottom border.</p>
</body>
