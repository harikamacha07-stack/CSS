<head>
    <style>
        div { color: blue;
            background-color: yellow; border:black 2px solid;
        }
    </style>
</head>
<body>
    <h1>floating styles</h1>
    /*right float*/
    <div style="float:right;">
        <p>right</p>
    </div>
    /*left float*/
      <div style="float:left;">
        <p>left</p>
      </div>
          /*bottom float*/

    <div style="float:bottom;">
        <p>bottom</p>
    </div>
    /*top float*/

    <div style="float:top;">
        <p>top</p>
    </div>
</body>
