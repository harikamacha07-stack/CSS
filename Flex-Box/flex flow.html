<haed>
    <style>
        .c1 { display:flex; background-color: blueviolet;}
        .c1 div,p {background-color: antiquewhite;border:2px black solid;padding:5px;margin: auto;color:red}
    </style>
</haed>
<body>
    <h1>flex-direction</h1>
    <div class="c1">
        /*column*/
        <p style="flex-direction: column;"><div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div></p><hr>
        /*row*/
        <p style="flex-direction: row;"><div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div></p><hr>
        /*column-reverse*/
        <p style="flex-direction: column-reverse;"><div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div></p><hr>
        /*row-reverse*/
        <p style="flex-direction: row-reverse;"><div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div></p>
        </div>
        <div class="c1"><hr><hr>
       <h1>flex-wrap</h1>
       /*wrap*/
       <p style="flex-wrap:wrap"><div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div></p> <hr>
       /*no-wrap*/
       <p style="flex-wrap:nowrap"><div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div></p> <hr>
       /*wrap-reverse*/
       <p style="flex-wrap:wrap-reverse"><div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div></p> <hr><hr>
        </div>
        <div class="c1">
       <h1>flex-flow</h1>
       /*ex-1*/
       <p style="flex-flow: row wrap;">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
       </p><hr>
              /*ex-2*/

       <p style="flex-flow:column nowrap">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
       </p>
    </div>
</body>
