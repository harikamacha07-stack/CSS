<head>
    <style>
        .c {display:flex;flex-flow:wrap row;height:500px;width:auto;background-color: aqua;
        align-items: center;justify-content: center;}
        .c div {background-color: aliceblue;border:solid black 1px;text-align:center;
        width:100px;height:200px;display:flex;align-items: center;justify-content: center;}
    </style>
</head>
<body>
    <h1>grow property</h1>
    <div class="c">
        <div>1</div>
        <div style="flex-grow: 5;">2</div>
        <div>3</div>
        <div>4</div> 
    </div>
    <h1>shrink property</h1>
    <div class="c">
        <div>1</div>
        <div style="flex-shrink:5;">2</div>
        <div>3</div>
        <div>4</div> 
    </div>
    <h1>basis property</h1>
    <div class="c">
        <div>1</div>
        <div style="flex-basis: 500px;">2</div>
        <div>3</div>
        <div>4</div> 
    </div>
</body>
