<head>
    <style>
        .c1 {display:flow;background-color: lightseagreen;border:10px solid black;border-collapse:separate;width:auto;}
        .c1 div {background-color: rgb(187, 214, 34);color:red;border:solid black 5px;padding:2px;}
    </style>
</head>
<body>
    <h1>Justify-Content</h1>
    <div class="c1">
        /*center*/
        <div style="justify-content: center;">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        </div>
         /*flex-start*/
        <div style="justify-content: flex-start;">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        </div>
         /*flex-end*/
        <div style="justify-content: flex-end;">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        </div>
         /*space-around*/
        <div style="justify-content: space-around;">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        </div>
         /*space-between*/
        <div style="justify-content: space-between;">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        </div>
         /*space-evenly*/
        <div style="justify-content: space-evenly;">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        </div>
    </div>
</body>
