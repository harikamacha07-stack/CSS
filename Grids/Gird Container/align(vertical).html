<head>
    <style>
        .c1 {display:grid;background-color: aqua;padding: 5px;gap:5px;grid-template-columns: auto auto auto;height:300px;}
        .c1 div {background-color: aliceblue;padding: 5px;text-align: center;font-size: large;}
    </style>
</head>
<body>
    <h1>align content</h1>
    /*space evenly*/ 
    <div class="c1" style="align-content: space-evenly;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
/*space around*/ 
    <div class="c1" style="align-content: space-around;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    /*space between*/ 
    <div class="c1" style="align-content: space-between;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    /*center*/ 
    <div class="c1" style="align-content:center;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    /*start evenly*/ 
    <div class="c1" style="align-content:start;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    /*end evenly*/ 
    <div class="c1" style="align-content:end;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    
</body>
