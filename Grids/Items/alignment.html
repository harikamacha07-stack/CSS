<head>
    <style>
        .c1 {display:grid;background-color: aqua;padding: 5px;gap:5px;
            grid-template-rows:100px 100px;grid-template-columns:auto auto auto;}
        .c1 div {background-color: aliceblue;padding: 5px;text-align: center;font-size: large;}
    </style>
</head>
<body>
    <h1>horizontal alignment</h1>
    <div class="c1">
            <div style="justify-self: auto;">1</div>
            <div style="justify-self: start;">2</div>
            <div style="justify-self: end;">3</div>
            <div style="justify-self: left;">4</div>
            <div style="justify-self: right;">5</div>
            <div style="justify-self: center;">6</div>
            <div style="justify-self: stretch;">7</div>
            <div style="justify-self: normal;">8</div>
    </div>
    <h1>vertical alignment</h1>
    <div class="c1">
            <div style="align-self: auto;">1</div>
            <div style="align-self: start;">2</div>
            <div style="align-self: end;">3</div>
            <div style="align-self: center;">4</div>
            <div style="align-self: stretch;">5</div>
            <div style="align-self: normal;">6</div>
    </div>
</body>
