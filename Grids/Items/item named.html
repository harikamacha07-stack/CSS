<head>
    <style>
        .c1 { display:grid;background-color: blue;padding: 5px;gap: 5px;
            grid-template-areas:'myHeader myHeader myHeader myHeader myHeader ';}
        .c2 { display:grid;background-color: blue;padding: 5px;gap: 5px;
            grid-template-areas:'myHeader myHeader myHeader . .';}
        .c3 { display:grid;background-color: blue;padding: 5px;gap: 5px;
            grid-template-areas:'myHeader  myHeader . . .'
                                'myHeader myHeader . . .';}
        .c4 { display:grid;background-color: blue;padding: 5px;gap: 5px;
            grid-template-areas:'myHeader  myHeader myHeader myHeader myHeader'
                                'menu content content content right'
                                'menu footer footer footer footer';}                        
         div {
  background-color: #f1f1f1;
  color:#000;
  padding: 10px;
  font-size: 30px;
  text-align: center;
  align-content: center;
}
.i1 { grid-area:myHeader; }
.i2 { grid-area:menu; }
.i3 { grid-area:content; }
.i4 { grid-area:right; }
.i5 { grid-area:footer; }
    </style>
</head>
<body>
    /*all are named*/
    <div class="c1">
            <div class="i1">1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    /*some are not named*/
    <div class="c2">
            <div>1</div>
            <div>2</div>
            <div class="i1">3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    /*two rows*/
    <div class="c3">
            <div>1</div>
            <div>2</div>
            <div class="i1">3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
    </div>
    /*complete template*/
    <div class="c4">
            <div class="i1">Header</div>
            <div class="i2">menu:
                <div>1</div>
                <div>2</div>
                <div>3</div>
            </div>
            <div class="i3">content</div>
            <div class="i4">right</div>
            <div class="i5">footer</div>
    </div>
</body>
