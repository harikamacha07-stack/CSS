<head>
    <style>
        .container { display:grid;
            grid-template-areas: "header header" "menu content" "footer footer";
            grid-template-columns: 1fr 3fr;
            background-color:blue; padding: 5px;gap:5px;
        }
        .container div { background-color: aliceblue;padding: 10px; }
        .container div.header { text-align: center;color: black;grid-area:header;}
        .container div.menu { grid-area: menu;}
        .container div.content { grid-area: content;}
        .container div.footer { grid-area:footer;text-align: center;}
    </style>
</head>
<body>
    <h1>intro to grids</h1>
    <div class="container">
        <div class="header">HEADER</div>
        <div class="menu"><a href="#">Link 1</a><br><a href="#">Link 2</a><br><a href="#">Link 3</a></div>
        <div class="content"><h3>content</h3>
            <P>this is content area</P>
        </div>
        <div class="footer">FOOTER</div>
    </div>
</body>
