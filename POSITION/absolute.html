<head>
    <style>
        div.b {
            position:relative;
            border:2px dotted rgb(250, 24, 182);
            background-color: blanchedalmond;
            color:black; width:200px;height:200px;
        }
        div.a {
            position:absolute; right:0;bottom:0;
            border:2px dotted blue;
            background-color: blanchedalmond;
            color:black; width:100px;height:100px;
        }
         
    </style>
</head>
<body>
    <h1>absolute Position</h1>
    <p>here position is absolute to right bottom</p>
    <div class="b">this is relative position
        <div class="a">this is absolute position</div>
    </div>
    
    
</body>
