<head>
    <style>
        p.a {
            position: static;
            background-color: aqua;color: darkblue;border:black solid 2px;
        }
        p.b {
            position: relative;
            left:20px;
            background-color: aqua;color: darkblue;border:black solid 2px;
        }
    </style>
</head>
<body>
    <h1>static position</h1>
    <p class="a">this is static poisitioning</p>
     <h1>relative position</h1>
    <p class="b">this is relative left poisitioning</p>
</body>
