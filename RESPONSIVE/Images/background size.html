<head>
    <meta name="viewport" content="width=device-width , initial-scale=1.0;">
    <style>
        div {
            width: 100%; height:auto;
            background-image:url('https://birdcultureindia.com/_media/website-project-media/websites/bc541e07-1d66-4872-9a3a-8b730c2c1129/articles/86c1450b-b681-49a9-84ab-39ae1bd62c9b/images/hero.webp');
            background-position: center;
            background-repeat: no-repeat;
            border: 2px solid black;
            border-radius: 10px;
        }
        .bkg1 { background-size: cover; }
        .bkg2 { background-size: contain; }
        .bkg3 { background-size: 100% 100%; }
    </style>
</head>
<body>
    <h1>Responsive Background Images</h1>
    <p>Resize the browser window to see how the background image scales with the width of its container.</p>
    <div class="bkg1" style="height: 200px;"></div>
    <p>Background-size: cover</p>
    <div class="bkg2" style="height: 200px;"></div>
    <p>Background-size: contain</p>
    <div class="bkg3" style="height: 200px;"></div>
    <p>Background-size: 100% 100%</p>
</body>
