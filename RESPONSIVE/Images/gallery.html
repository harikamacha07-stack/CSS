<head>
   <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background-color:black; } 
    .header { background-color: #f1f1f1; padding: 20px; text-align: center; }
    .container {
        display:grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 0 4px;
    }
    .column {
        flex: 25%;
        max-width: 25%;
        padding: 0 4px;
    } 
    .column img {
        margin-top: 8px;
        vertical-align: middle;
    }
    @media screen and (max-width: 800px) {
        .column {
            flex: 50%;
            max-width: 50%;
        }
    }
    @media screen and (max-width: 600px) {
        .column {
            flex: 100%;
            max-width: 100%;
        }
    }
   </style>
</head>
