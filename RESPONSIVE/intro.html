<head>
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <style>
        * { box-sizing: border-box;}
        body { font-family: 'Courier New', Courier, monospace;
                font-size:medium;font-weight: bolder;}
        .container { display:grid;background-color: aqua;padding: 10px;margin:5px;
        grid-template-areas: "header" "menu" "content" "facts" "footer";}
        .header { grid-area: header; background-color: blueviolet;
                   color: aliceblue;text-align: center;}
        .header > h1 { font-size: 50px;font-weight: bold;}
        .menu { grid-area: menu;}
        .menu ul { list-style-type: none; padding: 0;margin: 0;}
        .menu li { padding: 5px;background-color:chartreuse;color: black;}
        .menu li:hover {background-color:rgb(249, 70, 20);}
        .content { grid-area: main;}
        .content > h1 { text-align: center;font-size: 40px;font-weight: bold;}
        .content > p { margin-bottom: 5px;}
        .facts { grid-area:facts; border:2px black solid;padding:9px;}
        .facts > h1 { font-size: 30px;font-weight: bold;}
        .facts ul {list-style-type: circle;}
        .facts li { margin-bottom: 10px;}
        .footer { grid-area:footer; background-color: darksalmon;
                   padding:5px;color:brown;text-align: center;font-weight: bold;}
        @media (min-width:600px) {
           .header { grid-area: 1 / span 6;}
           .menu { grid-area: 2 / span 1;}
           .content { grid-area: 2 / span 4;}
           .facts { grid-area: 3 / span 6;}
           .footer { grid-area: 4 / span 6;}
        }
        @media (min-width:768px) {
            .header { grid-area: 1 / span 6;}
            .menu { grid-area: 2 / span 1;}
            .content { grid-area: 2 / span 4;}
            .facts { grid-area: 2 / span 1;}
            .footer { grid-area: 3 /span 6;}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>RESPONSIVE</h1></div>
        <div class="menu">
            <ul>
                <li>Link1</li>
                <li>Link2</li>
                <li>Link3</li>
                <li>Link4</li>
                <li>Link5</li>
                <li>Link6</li>
            </ul>
        </div>
        <div class="content">
            <h1>content</h1>
            <p>this is content part</p>
            <p>this para represents responsive behaviour</p>
        </div>
        <div class="facts">
            <h1>The Facts</h1>
            <ul>
                <li>Fact-1</li>
                <li>Fact-2</li>
            </ul>
        </div>
        <div class="footer"><p>this is footer part</p></div>
    </div>
</body>
