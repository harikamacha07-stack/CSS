<head>
<style>
    table {
        border:solid 15px black;
        background-color: bisque;
        border-collapse: collapse;
    }
    th,td {
        border:solid 2px black;
        background-color: bisque;
        border-collapse: collapse;
    }
    th,td.a{border-left:2px solid black;}
        th,td.b{border-bottom:2px solid black;}
</style>
</head>
<body>
    /*padding*/
    <table style="padding: 50px;">
        <tr>
            <th>s.no</th>
            <th>name</th>
        </tr>
        <tr>
            <td>1</td>
            <td>hari</td>
        </tr>
        <tr>
            <td>2</td>
            <td>harish</td>
        </tr>
        <tr>
            <td>3</td>
            <td>harika</td>
        </tr>
    </table>
    /*left divider*/
    <table class="a" >
        <tr>
            <th>s.no</th>
            <th>name</th>
        </tr>
        <tr>
            <td>1</td>
            <td>hari</td>
        </tr>
        <tr>
            <td>2</td>
            <td>harish</td>
        </tr>
        <tr>
            <td>3</td>
            <td>harika</td>
        </tr>
    </table>
    /*right-divider*/
    <table class="b" >
        <tr>
            <th>s.no</th>
            <th>name</th>
        </tr>
        <tr>
            <td>1</td>
            <td>hari</td>
        </tr>
        <tr>
            <td>2</td>
            <td>harish</td>
        </tr>
        <tr>
            <td>3</td>
            <td>harika</td>
        </tr>
    </table>
</body>
