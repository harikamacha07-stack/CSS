<head>
    <style>
        span {
            background-color: chartreuse;
            padding: 5px;
        }
        p { background-color: darkolivegreen;}
        p.ex1  { display: none;}
     p.ex2  { display: inline;}
      p.ex3 { display:flex;}
       p.ex4{ display:block;}
        p.ex15  { display:inline-block;}
         p.ex6  { display:grid;}
     
    </style>
</head>
<body>
<h1>Display Properties</h1>
<h2>none:</h2>
<p class="ex1">
  <span>Text 1</span>
  <span>Text 2</span>
  <span>Text 3</span>
</p>
<h2>inline:</h2>
<p class="ex2">
  <span>Text 1</span>
  <span>Text 2</span>
  <span>Text 3</span>
</p>
<h2>flex:</h2>
<p class="ex3">
  <span>Text 1</span>
  <span>Text 2</span>
  <span>Text 3</span>
</p>
<h2>block:</h2>
<p class="ex4">
  <span>Text 1</span>
  <span>Text 2</span>
  <span>Text 3</span>
</p>
<h2>inline-block:</h2>
<p class="ex5">
  <span>Text 1</span>
  <span>Text 2</span>
  <span>Text 3</span>
</p><h2>grid:</h2>
<p class="ex6">
  <span>Text 1</span>
  <span>Text 2</span>
  <span>Text 3</span>
</p>
</body>
